# config.yaml — Configuracion del negocio. Rastreado en git.

negocio:
  nombre: "DM Barber Shop"
  telefono_contacto: "+34 682 21 44 69"
  admin_phone: ""   # Fallback si no se define ADMIN_PHONE en .env. Solo digitos, sin '+' ni espacios.

# Horario de apertura por dia de la semana.
# Claves validas: lunes, martes, miercoles, jueves, viernes, sabado, domingo.
# Cada dia es una lista de rangos [inicio, fin] en formato HH:MM.
# Los dias no listados se consideran cerrados.
horario:
  lunes:
    - ["10:00", "14:00"]
    - ["17:00", "21:00"]
  martes:
    - ["10:00", "14:00"]
    - ["17:00", "21:00"]
  miercoles:
    - ["10:00", "14:00"]
    - ["17:00", "21:00"]
  jueves:
    - ["10:00", "14:00"]
    - ["17:00", "21:00"]
  viernes:
    - ["10:00", "14:00"]
    - ["17:00", "21:00"]
  sabado:
    - ["10:00", "14:00"]

# Dias hacia adelante que se ofrecen al cliente para elegir dia de cita.
ventana_busqueda_dias: 14

# Servicios ofrecidos. Maximo 9 (limite de filas de lista de WhatsApp).
servicios:
  corte:
    nombre: "Corte de pelo"
    precio: 10
    duracion_min: 30
    presencia_cliente_min: 30
  corte_barba:
    nombre: "Corte de pelo + barba"
    precio: 12
    duracion_min: 30
    presencia_cliente_min: 30
  mechas:
    nombre: "Mechas"
    precio: 30
    duracion_min: 60
    presencia_cliente_min: 180
  tinte:
    nombre: "Tinte"
    precio: 40
    duracion_min: 60
    presencia_cliente_min: 180

# Ventana de busqueda de citas en Google Calendar (dias desde hoy).
lookaheads_dias:
  citas_cliente: 15
  citas_manuales: 15

# Ventana de envio de recordatorios (horas antes de la cita).
recordatorio_horas_antes:
  desde: 23
  hasta: 25

# Activar o desactivar el envio de mensajes automaticos.
envios:
  recordatorios: false
  confirmaciones: false

# Evento especial — activa una cuarta opcion "Cita {nombre}" en el menu principal.
# Para activarlo: pon activo: true, rellena nombre y dias.
# dias: mapa de fecha ISO (YYYY-MM-DD) a lista de rangos [inicio, fin] en HH:MM.
# Ejemplo de configuracion activa:
#   evento:
#     activo: true
#     nombre: "Navidad 2026"
#     dias:
#       "2026-12-20": [["10:00", "14:00"]]
#       "2026-12-21": [["10:00", "14:00"], ["17:00", "20:00"]]
evento:
  activo: false
